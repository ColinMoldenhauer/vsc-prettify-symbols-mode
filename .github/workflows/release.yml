name: Build and release .vsix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Set version from tag
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm pkg delete //version

      - name: Package extension
        run: npx --yes @vscode/vsce package --out prettify-symbols-mode-continued-${{ github.ref_name }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    # Marketplace rejects versions with a suffix such as -dev, so only publish plain vX.Y.Z tags
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # the identity has no Azure role, only Marketplace access
          allow-no-subscriptions: true

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --azure-credential --packagePath *.vsix

  publish-openvsx:
    # Open VSX (VSCodium, Theia, Gitpod, ...). Skipped with a notice until the OVSX_PAT secret exists.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"

      - name: Skip notice
        if: ${{ env.OVSX_PAT == '' }}
        run: echo "::notice::OVSX_PAT secret is not set, skipping Open VSX publish"
