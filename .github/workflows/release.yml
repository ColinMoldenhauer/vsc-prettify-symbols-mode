name: Build and release .vsix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}"
            exit 1
          fi

      - run: npm install

      - name: Package extension
        run: npx --yes @vscode/vsce package --out prettify-symbols-mode-continued-${{ github.ref_name }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
